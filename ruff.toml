# ---------------------------------------------------------------------------
# Ruff 静态检查配置（阶段 8）
#
# 选择规则集：
#   E/W  pycodestyle 错误与警告
#   F    pyflakes（未使用导入 / 未定义名）
#   I    isort（导入顺序）
#   UP   pyupgrade（过时语法）
#   B    flake8-bugbear（常见缺陷）
#   S    bandit 安全规则（**核心**：本项目的安全纪律需要机器检查兜底）
#
# 有意忽略的规则及理由（不做「为了让检查通过而关掉安全规则」的事）：
#   E501  行过长：本项目注释与文档为中文，字符宽度按 1 计但显示宽度约为 2，
#         纯按列数限制会迫使中文注释被无意义地截断。
#   B008  函数默认值里调用函数：FastAPI 的 `Body(...)` / `Depends(...)`
#         是官方规定用法，此处忽略属于框架惯用法而非缺陷。
#   S101  断言：测试文件与冒烟脚本中 assert 是标准做法；生产代码中的
#         assert 已单独修正（见 app/services/plugin_service.py）。
# ---------------------------------------------------------------------------
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["E501", "B008", "S101"]

[lint.per-file-ignores]
# 测试与冒烟脚本：允许 assert、允许魔法值、允许子进程调用
"tests/*" = ["S101", "S105", "S106", "S108", "B011"]
"scripts/*" = ["S101", "S603", "S607", "S310", "S108", "B008", "B904"]

[lint.isort]
known-first-party = ["app"]
